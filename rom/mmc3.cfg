# MMC3 (mapper 4) - 64 KB PRG in eight 8 KB banks.
#   $8000 switchable (R6), $A000 switchable (R7),
#   $C000 fixed penultimate, $E000 fixed last (code).
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, define = yes;
    RAM:    start = $0200, size = $0100, type = rw, define = yes;
    HDR:    start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    PRG0:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
    PRG1:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
    PRG2:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
    PRG3:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
    PRG4:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
    PRG5:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
    PRG6:   start = $C000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRGF:   start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    CHRROM: start = $0000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    HEADER:  load = HDR,  type = ro;
    BANK0:   load = PRG0, type = ro;
    BANK1:   load = PRG1, type = ro;
    BANK2:   load = PRG2, type = ro;
    BANK3:   load = PRG3, type = ro;
    BANK4:   load = PRG4, type = ro;
    BANK5:   load = PRG5, type = ro;
    CODE:    load = PRGF, type = ro, start = $E000;
    VECTORS: load = PRGF, type = ro, start = $FFFA;
    ZEROPAGE: load = ZP,  type = zp;
    BSS:     load = RAM,  type = bss, define = yes;
}
