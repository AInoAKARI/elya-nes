# MMC5, 96 KB PRG in twelve 8 KB banks, PRG mode 3.
#   banks 0-6  weight stream, seen through $8000-$9FFF ($5114, slides)
#   bank  7    embedding table, at $A000-$BFFF ($5115 = $87)
#   bank  8    positional table, at $A000-$BFFF ($5115 = $88)
#   bank  9    row headers + lookup tables, at $C000-$DFFF ($5116 = $89)
#   bank  10   spare - keeps the image a whole number of 16 KB units
#   bank  11   code, chains and vectors, fixed at $E000-$FFFF ($5117 = $8B)
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, define = yes;
    # capped at $0200-$02FF: a result slot growing into the marker port at
    # $0300 or the page-aligned data pages at $0400+ is a LINK ERROR
    RAM:    start = $0200, size = $0100, type = rw, define = yes;

    HDR:    start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    WS0:    start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
    WS1:    start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
    WS2:    start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
    WS3:    start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
    WS4:    start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
    WS5:    start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
    WS6:    start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
    EMB:    start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
    POS:    start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
    TBL:    start = $C000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
    SPARE:  start = $C000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
    PRGF:   start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    CHRROM: start = $0000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    HEADER:   load = HDR,  type = ro;
    STREAM0:  load = WS0,  type = ro;
    STREAM1:  load = WS1,  type = ro;
    STREAM2:  load = WS2,  type = ro;
    STREAM3:  load = WS3,  type = ro;
    STREAM4:  load = WS4,  type = ro;
    STREAM5:  load = WS5,  type = ro;
    STREAM6:  load = WS6,  type = ro;
    EMBED:    load = EMB,  type = ro,  start = $A000;
    POS:      load = POS,  type = ro,  start = $A000;
    HEADERS:  load = TBL,  type = ro,  start = $C000;
    TABLES:   load = TBL,  type = ro,  align = $100;
    CHAINS:   load = PRGF, type = ro,  start = $E000;
    CODE:     load = PRGF, type = ro;
    VECTORS:  load = PRGF, type = ro,  start = $FFFA;
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = RAM,  type = bss, define = yes;
}
