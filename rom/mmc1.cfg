# MMC1 (mapper 1) - 64 KB PRG in four 16 KB banks.
#   $8000-$BFFF switchable, $C000-$FFFF fixed to the last bank (code).
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, define = yes;
    RAM:    start = $0200, size = $0100, type = rw, define = yes;
    HDR:    start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    PRG0:   start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $00;
    PRG1:   start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $00;
    PRG2:   start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $00;
    PRGF:   start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    CHRROM: start = $0000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    HEADER:  load = HDR,  type = ro;
    BANK0:   load = PRG0, type = ro;
    BANK1:   load = PRG1, type = ro;
    BANK2:   load = PRG2, type = ro;
    CODE:    load = PRGF, type = ro, start = $C000;
    VECTORS: load = PRGF, type = ro, start = $FFFA;
    ZEROPAGE: load = ZP,  type = zp;
    BSS:     load = RAM,  type = bss, define = yes;
}
