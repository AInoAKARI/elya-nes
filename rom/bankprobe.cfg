# MMC5 bank-budget probe.  NBANK stamped 8 KB banks plus a fixed code bank.
# STAMPS is one contiguous memory area rather than NBANK separate ones: the
# banks are only ever read through the $8000 window, so their addresses at
# link time are irrelevant and the file layout is all that matters.
MEMORY {
    ZP:      start = $0000, size = $0100, type = rw, define = yes;
    RAM:     start = $0200, size = $0100, type = rw, define = yes;

    HDR:     start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    STAMP:   start = $8000, size = $FE000, type = ro, file = %O, fill = yes, fillval = $00;
    PRGF:    start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    CHRROM:  start = $0000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    HEADER:   load = HDR,   type = ro;
    STAMPS:   load = STAMP, type = ro;
    CODE:     load = PRGF,  type = ro,  start = $E000;
    VECTORS:  load = PRGF,  type = ro,  start = $FFFA;
    ZEROPAGE: load = ZP,    type = zp;
    BSS:      load = RAM,   type = bss, define = yes;
}
